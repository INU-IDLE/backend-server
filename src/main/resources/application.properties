spring.application.name=rushcutter

# PostgreSQL
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.csrf.enabled=false

# ODsay API
odsay-api-key=${ODSAY_API_KEY}
congestion.api.base-url=${CONGESTION_API_BASE_URL}

# Seoul API
openapi.seoul.key=${OPENAPI_SEOUL_KEY}

# SK open API
sk.openapi.appkey=${SK_OPEN_API_KEY}

# ElastiCache
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}
spring.data.redis.timeout=${REDIS_TIMEOUT}